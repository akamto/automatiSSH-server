<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intents — Pantallas de Ajustes</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--line:#252b35;--tx:#e6e9ef;--dim:#8b94a3;--acc:#4da3ff;--ok:#37c98a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Roboto,"Segoe UI",sans-serif;padding:12px 12px 60px}
h1{font-size:19px;margin:6px 0 4px}
.sub{color:var(--dim);font-size:13px;margin-bottom:10px}
.warn{background:#1b2330;border:1px solid #2c3a4d;border-radius:10px;padding:10px;font-size:13px;color:#c3ccda;margin-bottom:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
input[type=search]{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:15px}
#count{font-size:12px;color:var(--dim);margin-top:6px}
h2{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--acc);margin:22px 0 8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.row.done{border-color:var(--ok)}
.meta{flex:1;min-width:0}
.lbl{font-weight:600;font-size:14px;display:block}
.cmp{font:11px/1.3 ui-monospace,Menlo,monospace;color:var(--dim);word-break:break-all;display:block;margin-top:3px}
a.open{background:var(--acc);color:#04101f;font-weight:700;text-decoration:none;padding:9px 13px;border-radius:9px;font-size:13px;white-space:nowrap}
button.cp{background:#222a35;color:var(--tx);border:1px solid var(--line);padding:9px 11px;border-radius:9px;font-size:13px;cursor:pointer}
button.dn{background:none;border:1px solid var(--line);color:var(--dim);padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer}
.row.done button.dn{color:var(--ok);border-color:var(--ok)}
</style>
</head>
<body>
<h1>Intents — pantallas de Ajustes</h1>
<div class="sub">Toca <b>Abrir</b>. Si no pasa nada, toca <b>Copiar</b> y pega el texto en la barra de direcciones.</div>
<div class="warn">No cierres esta pestaña. Marca lo probado con ✓ para llevar la cuenta y no repetir.</div>

<div class="bar">
  <input type="search" id="q" placeholder="Filtrar (cuenta, wifi, apps…)" autocomplete="off">
  <div id="count"></div>
</div>

<main id="list"></main>

<script>

]]

const KEY = "frp_progress_v1";
let done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));
const list = document.getElementById("list");
const count = document.getElementById("count");

function paint(){
  const total = document.querySelectorAll(".row").length;
  count.textContent = done.size + " / " + total + " probados";
}

function row(label, cmp){
  const d = document.createElement("div");
  d.className = "row" + (done.has(cmp) ? " done" : "");
  const meta = document.createElement("div");
  meta.className = "meta";
  const l = document.createElement("span");
  l.className = "lbl"; l.textContent = label;
  const c = document.createElement("span");
  c.className = "cmp"; c.textContent = cmp;
  meta.append(l, c);

  const a = document.createElement("a");
  a.className = "open";
  a.href = "intent:#Intent;component=" + cmp + ";end";
  a.target = "_top";
  a.textContent = "Abrir";
  a.addEventListener("click", () => {
    if(!done.has(cmp)){ done.add(cmp); localStorage.setItem(KEY, JSON.stringify([...done])); d.classList.add("done"); paint(); }
  });

  const cp = document.createElement("button");
  cp.className = "cp"; cp.textContent = "Copiar";
  cp.addEventListener("click", async () => {
    const txt = "intent:#Intent;component=" + cmp + ";end";
    try { await navigator.clipboard.writeText(txt); }
    catch(e){ const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    cp.textContent = "✓";
    setTimeout(() => cp.textContent = "Copiar", 1200);
  });

  const dn = document.createElement("button");
  dn.className = "dn"; dn.textContent = done.has(cmp) ? "✓" : "○";
  dn.addEventListener("click", () => {
    if(done.has(cmp)){ done.delete(cmp); dn.textContent = "○"; d.classList.remove("done"); }
    else { done.add(cmp); dn.textContent = "✓"; d.classList.add("done"); }
    localStorage.setItem(KEY, JSON.stringify([...done])); paint();
  });

  d.append(meta, a, cp, dn);
  return d;
}

GROUPS.forEach(([name, items]) => {
  const h = document.createElement("h2"); h.textContent = name;
  list.appendChild(h);
  items.forEach(([label, cmp]) => list.appendChild(row(label, cmp)));
});

document.getElementById("q").addEventListener("input", e => {
  const v = e.target.value.toLowerCase().trim();
  document.querySelectorAll("h2").forEach(h => {
    let shown = 0, n = h.nextElementSibling;
    while(n && n.classList && n.classList.contains("row")){
      const hit = !v || n.textContent.toLowerCase().includes(v);
      n.style.display = hit ? "" : "none";
      if(hit) shown++;
      n = n.nextElementSibling;
    }
    h.style.display = shown ? "" : "none";
  });
});

document.getElementById("count").addEventListener("dblclick", () => {
  if(confirm("¿Reiniciar marcas?")){ done.clear(); localStorage.removeItem(KEY); document.querySelectorAll(".row").forEach(r => r.classList.remove("done")); document.querySelectorAll(".dn").forEach(b => b.textContent = "○"); paint(); }
});

paint();
</script>
</body>
</html>
